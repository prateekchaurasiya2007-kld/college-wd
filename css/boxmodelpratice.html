<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX MODEL</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        html,*{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        #main{
            background-color: aqua;
            height: 400px;
            width: 900px;
            margin: 0 auto;
            border: 5px solid;
            display: flex;

        }
        left{
            background-color: brown;
            height: 390px;
            width: 300px;
            margin-right: 50px;
        }
        right{
            background-color: blueviolet;
            height: 390px;
            width: 550px;

        }
        .rgt_box{
            width: 100%;
            height: 175px;
            background-color: darkgreen;
        }
        .rgt_box:nth-child(1){
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!--main box-->
    <div> id="main" </div>
    <div>id="left" </div>
    <div> id="right"
        
    </div>
    <div> 3rd</div>
    
</body>
</html>
