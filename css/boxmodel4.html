<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX MODEL</title>
    <style>
        body{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        html,*{
            margin: 2px;
            padding: 0px;
            box-sizing: border-box;
        }
        #main{
        background-color: aquamarine;
        height: 50px;
        width: 800px;
        margin: 0;
        border: 5px solid;
        display: flex;
        }
     #right{
         background-color: blueviolet;
            height: 40px;
            width: 800px;
            border: 5px solid;
     }
      #left{
        background-color: yellowgreen;
        height: 39px;
        width: 475px;
      }
      #two{
      background-color: gold;
      height: 199px;
      width: 475px;




      }
       #first{
        background-color: coral;
         height: 250px;
        width: 475px;

        
       } 
       .ball{
        background-color: bisque;
        height: 250px;
        width: 475px;
        display: flex;
       }
       #second{
        background-color: brown;
        height: 250px;
        width: 475px;
       }
    






    </style>
</head>
<body>
  <div>
     <div id="main"></div>
     <div id="right"></div>
     <div id="left"></div>
     <div id="two"></div>
     <div class="ball">
     <div id="first"></div>
     <div id="second"></div>
     </div>

</body>
</html>
