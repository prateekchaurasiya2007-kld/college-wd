<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            
        }
  html,*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;}
    main{
        display: grid;
        /* grid-template-columns: repeat(2, 1fr); */
        grid-template-rows: auto 200px auto 300px;
        gap: 10px;
    }

    .box{
        background-color: green ;
        /* height: 240px; */
    }
    .section{
        display: grid;
        grid-template-columns: repeat(2,1fr);
        gap: 10px;
    }
    #left{
        display: grid;
        grid-template-rows: 150px;
        gap: 10px;
    }
    #right{
        background-color: brown;
    }
    article{
        background-color: darkmagenta;
    }
    aside{
        background-color: magenta;
    }





    </style>
</head>
<body>
    <main>
    <div class="box">1<h2>HEADER</h2></div>
    <div class="box">2<h2>NAV</h2></div>
    <div class="section">
        <div id="left">
        <article><h2>Article</h2></article>
        <aside><h2>Aside</h2></aside></div>
        <div id="right"><h2>Footer</h2></div>  
    </div>
    <div class="box">4<h4>BODY</h4></div>
    <div class="box">5<h2>IDDC</h2></div>
    </main>
    
</body>
</html>
